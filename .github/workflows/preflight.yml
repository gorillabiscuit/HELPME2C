# Runs the same full check as the pre-push hook (`pnpm preflight`: typecheck + lint + tests)
# on every pull request and every push to main. Needs no secrets: the tests mock the database
# and external APIs. Actions are pinned to a commit so a moved tag cannot change what runs.
name: preflight

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight
